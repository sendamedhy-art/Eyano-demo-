<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E78">
<title>Eyano — démo v1.0</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🩺%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#F4F7F8;--cd:#fff;--ink:#12313A;--mu:#4A6670;--ln:#D5E0E4;--ac:#0B6E78;--wb:#FFF1D6;--wt:#7A4300;--ub:#B3261E;--dm:#FFD84D;--di:#1A1A1A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1A1E;--cd:#172429;--ink:#E6F0F2;--mu:#9DB5BC;--ln:#2A3D44;--ac:#5CC6D0;--wb:#3A2A0A;--wt:#FFCB7A}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1A1E;--cd:#172429;--ink:#E6F0F2;--mu:#9DB5BC;--ln:#2A3D44;--ac:#5CC6D0;--wb:#3A2A0A;--wt:#FFCB7A}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--dm);z-index:10}
#demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--dm);color:var(--di);font-weight:700;font-size:14px;padding:6px 14px;text-align:center}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:30px;margin:8px 0 2px}h2{font-size:23px;margin:6px 0 8px;line-height:1.25}h3{font-size:15px;margin:0 0 4px;color:var(--mu);font-weight:600}
a{color:var(--ac)}
.row{display:block;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin:8px 0;color:inherit;text-decoration:none;min-height:48px}
.row b{display:block;font-size:18px}.row span{color:var(--mu);font-size:15px}
.bl{background:var(--cd);border-left:4px solid var(--ac);padding:10px 14px;margin:10px 0;border-radius:0 8px 8px 0}
.bl p{margin:0 0 4px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--dm);color:var(--di);margin-right:6px}
.warn{background:var(--wb);color:var(--wt);border:1px solid var(--wt);border-radius:8px;padding:10px 14px;margin:10px 0;font-weight:600}
.mu{color:var(--mu);font-size:14px}
dt{color:var(--mu);font-size:14px;margin-top:6px}dd{margin:0}dl{margin:0}
input,select{font:inherit;width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln);z-index:9}
#bar a{display:block;max-width:612px;margin:0 auto;min-height:52px;line-height:52px;text-align:center;background:var(--ub);color:#fff;font-weight:700;border-radius:12px;text-decoration:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
summary{min-height:44px;line-height:44px;cursor:pointer}
[hidden]{display:none!important}
.an{position:relative;background:linear-gradient(135deg,#B45309,#7C2D12);color:#fff;border-radius:14px;padding:12px 48px 12px 14px;margin:12px 0}
.an b{display:block;font-size:16px}.an p{margin:2px 0 6px;font-size:15px}.an .mu{color:#fff;opacity:.92;font-size:12.5px}
.an button{position:absolute;top:2px;right:2px;width:44px;height:44px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.jr{display:block;margin:8px 0;padding:10px 14px;border-left:4px solid var(--ac);background:var(--cd);border-radius:0 10px 10px 0;color:inherit;text-decoration:none;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.card{display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,var(--c1),var(--c2));border-radius:18px;padding:14px;color:#fff;text-decoration:none;min-height:176px}
.card .tp{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;line-height:1.2}
.card .tp svg{width:20px;height:20px;flex:none;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.card .nb{font-size:44px;font-weight:700;line-height:1;margin-top:10px;letter-spacing:-1px}
.card .nb small{display:block;font-size:14px;font-weight:600;letter-spacing:0;opacity:.92;margin-top:2px}
.card .ds{font-size:12.5px;line-height:1.35;opacity:.92;margin-top:8px}
.ban{display:flex;align-items:center;justify-content:center;border-radius:18px;height:124px;margin:6px 0 12px;background:linear-gradient(145deg,var(--c1),var(--c2))}
.ban svg{width:76px;height:76px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dic{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:18px 0 8px}
.dic h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.dic .w{font-size:22px;font-weight:700}.dic .n{font-style:italic;color:var(--mu);margin-left:8px;font-size:15px}
.dic ol{margin:8px 0 0;padding-left:22px}.dic li{margin:8px 0}
.dic details{border-top:1px solid var(--ln);margin-top:10px}
.dic summary{list-style:none;color:var(--ac);font-weight:600}.dic summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="demo">DÉMO — données fictives, à ne pas utiliser pour votre santé</div>
<main id="app"></main>
<nav id="bar"><a href="#urgences">Urgence : besoin d’aide ?</a></nav>
<script>
let MD=[],FI=[],ANN=[];
const IC={maladies:'<circle cx="24" cy="24" r="9"/><path d="M24 6v6M24 36v6M6 24h6M36 24h6M11 11l4 4M33 33l4 4M37 11l-4 4M15 33l-4 4"/>',epidemies:'<circle cx="24" cy="24" r="16"/><path d="M8 24h32M24 8c-8 9-8 23 0 32M24 8c8 9 8 23 0 32"/>',secours:'<rect x="8" y="8" width="32" height="32" rx="8"/><path d="M24 15v18M15 24h18"/>',aide:'<path d="M8 40V18l16-10 16 10v22zM24 24v10M19 29h10"/>',journees:'<rect x="8" y="12" width="32" height="28" rx="4"/><path d="M8 21h32M16 8v8M32 8v8"/>',actus:'<rect x="9" y="9" width="30" height="30" rx="3"/><path d="M15 17h18M15 24h18M15 31h10"/>',examens:'<path d="M24 8c8 10 12 16 12 22a12 12 0 0 1-24 0c0-6 4-12 12-22z"/>',annexes:'<path d="M12 8h22a2 2 0 0 1 2 2v30H14a4 4 0 0 1-4-4V10a2 2 0 0 1 2-2zM10 36a4 4 0 0 1 4-4h26"/>'};
const GR={maladies:["#7C3AED","#4C1D95"],epidemies:["#DC2626","#7F1D1D"],secours:["#C2410C","#7C2D12"],aide:["#15803D","#14532D"],journees:["#2563EB","#1E3A8A"],actus:["#0F766E","#134E4A"],examens:["#BE185D","#831843"],annexes:["#475569","#0F172A"]};
const grs=id=>`--c1:${GR[id][0]};--c2:${GR[id][1]}`;
const nf=id=>FI.filter(f=>f.m===id).length;
const FIC={};
const NAT={maladies:"nom, maladie",epidemies:"nom, événement sanitaire",secours:"nom, geste",aide:"nom, structure",journees:"nom, journée mondiale",actus:"nom, annonce",examens:"nom, examen",annexes:"nom, page de référence"};
const card=m=>`<a class="card" href="#m-${m.id}" style="${grs(m.id)}"><div><div class="tp"><svg viewBox="0 0 48 48" aria-hidden="true">${IC[m.id]}</svg>${m.t}</div><div class="nb">${nf(m.id)}<small>${nf(m.id)>1?"fiches":"fiche"}</small></div></div><div class="ds">${m.d}</div></a>`;
const dic=f=>{const g=f.g||{d:["Entrée de démonstration : définition fictive, sans valeur médicale."]};return `<div class="dic"><h3>Dans le dictionnaire d’Eyano</h3><div><span class="w">${f.t}</span><span class="n">${g.n||NAT[f.m]}</span></div><ol>${g.d.map(x=>`<li>${x}</li>`).join("")}</ol><details><summary>origine du nom ▼ dérouler</summary><p class="mu">${g.e||"À compléter : origine du nom, avec sa source."}</p></details></div>`};
const $=s=>document.querySelector(s),A=$("#app");
let off=0,sync=null;
try{sync=localStorage.getItem("eyano-sync")}catch(e){}
const now=()=>new Date(Date.now()+off*864e5);
const age=i=>(now()-new Date(i+"T12:00:00"))/864e5;
const fmt=i=>i?new Date(i+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"non précisée";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=id=>FI.find(x=>x.id===id);
const vd=f=>(f.d.find(x=>/^(Dernière v|Vérification des coord)/.test(x[0]))||[])[1];
const old=f=>f.ed!==undefined?f.ed<now().getFullYear():f.a?age(f.a)>(f.th||90):false;
const bl=(k,v)=>`<div class="bl"><h3>${k}</h3><p>${v}</p></div>`;
const row=(h,t,d)=>`<a class="row" href="${h}"><b>${t}</b><span>${d}</span></a>`;
const pr=e=>e[1]?`prix indicatif : ${e[1]}, vérifié le ${fmt(e[2])}. Il peut évoluer.${age(e[2])>90?" Prix ancien : à reconfirmer auprès de l’établissement.":""}`:"prix non communiqué (cela ne signifie jamais que l’examen est gratuit).";
const dis=()=>{try{return JSON.parse(localStorage.getItem("eyano-dis")||"[]")}catch(e){return[]}};
async function load(){let j=null;
try{if(navigator.onLine){const r=await fetch("data.json?"+Date.now(),{cache:"no-store"});if(r.ok){const t=await r.text();j=JSON.parse(t);try{localStorage.setItem("eyano-data",t);sync=new Date().toISOString().slice(0,10);localStorage.setItem("eyano-sync",sync)}catch(e){}}}}catch(e){j=null}
if(!j){try{j=JSON.parse(localStorage.getItem("eyano-data"))}catch(e){j=null}}
if(!j){try{const r=await caches.match("data.json");if(r)j=await r.json()}catch(e){j=null}}
if(j){MD=j.modules;FI=j.fiches;ANN=j.annonces||[]}}
function nextJ(){let b=null;const n=now(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());FI.filter(f=>f.jm).forEach(f=>{const[mo,d]=f.jm.split("-").map(Number);let t=new Date(n.getFullYear(),mo-1,d);if(t<t0)t=new Date(n.getFullYear()+1,mo-1,d);const k=Math.round((t-t0)/864e5);if(k<=30&&(!b||k<b.k))b={f,k}});return b}
function banners(){const t=now().toISOString().slice(0,10),x=ANN.find(a=>a.debut<=t&&t<=a.fin&&!dis().includes(a.id));let h="";
if(x)h+=`<div class="an"><b>${x.t}</b><p>${x.x}</p><span class="mu">${x.p} · valable jusqu’au ${fmt(x.fin)} · confirmé le ${fmt(x.cf)}</span><button data-x="${x.id}" aria-label="Fermer l’annonce">✕</button></div>`;
const j=nextJ();if(j)h+=`<a class="jr" href="#f-${j.f.id}">${j.k?"Dans "+j.k+" jour"+(j.k>1?"s":""):"Aujourd’hui"} : ${j.f.t}</a>`;return h}
function tools(){return `<p class="mu">Dernière synchronisation : ${sync?fmt(sync):"aucune"}</p><details><summary>Outils de test (démo)</summary><label class="mu" for="sim">Date du jour simulée</label><select id="sim">${[0,30,90,180,365].map(n=>`<option value="${n}"${n===off?" selected":""}>${n?"+"+n+" jours":"Date réelle"}</option>`).join("")}</select><p class="mu">Seuils d’essai, non validés : 30 jours (situation d’une épidémie), 90 jours (autres contenus), 180 jours (premiers secours).</p></details>`}
function home(){
A.innerHTML=`<h1>Eyano</h1><p class="mu">Mini-encyclopédie de santé. Version de démonstration 1.0.</p>${banners()}<input id="q" type="search" placeholder="Rechercher une fiche" aria-label="Rechercher une fiche"><div id="res"></div><div id="mods" class="grid">${MD.map(card).join("")}</div>`;
$("#q").oninput=e=>{const q=e.target.value.trim().toLowerCase(),r=q?FI.filter(f=>(f.t+" "+get(f.id).s+" "+MD.find(m=>m.id===f.m).t).toLowerCase().includes(q)):[];
$("#mods").hidden=!!q;$("#res").innerHTML=q?(r.length?r.map(f=>row("#f-"+f.id,f.t,`<span class="tag">DÉMO</span>${MD.find(m=>m.id===f.m).t}`)).join(""):'<p class="mu">Aucune fiche trouvée.</p>'):""}}
function mod(id){const m=MD.find(x=>x.id===id);if(!m)return home();
A.innerHTML=`<a href="#" class="mu">‹ Accueil</a><div class="ban" style="${grs(m.id)}"><svg viewBox="0 0 48 48" aria-hidden="true">${IC[m.id]}</svg></div><h2>${m.t}</h2><p class="mu">${m.d}</p>`+FI.filter(f=>f.m===id).map(f=>row("#f-"+f.id,f.t,`<span class="tag">DÉMO</span>${f.s}`)).join("")}
function urg(){A.innerHTML=`<a href="#" class="mu">‹ Accueil</a><h2>Besoin d’aide urgente ?</h2><div class="warn">Contacts d’urgence : en attente de vérification. Aucun numéro n’est affiché tant qu’il n’a pas été vérifié.</div>`+row("#m-secours","Premiers secours","Gestes et situations nécessitant de l’aide")+row("#m-aide","Aide et services de santé","Établissements et contacts vérifiés")}
function fiche(id){const f=get(id);if(!f)return home();const M=MD.find(m=>m.id===f.m);
let h=`<a href="#m-${f.m}" class="mu">‹ ${M.t}</a><div class="ban" style="${grs(f.m)}"><svg viewBox="0 0 48 48" aria-hidden="true">${FIC[f.id]||IC[f.m]}</svg></div><h2>${f.t}</h2><p><span class="tag">DÉMO</span>${f.s}</p>`;
if(!navigator.onLine)h+=`<div class="warn">Copie enregistrée sur votre téléphone. Dernière vérification de cette fiche : ${fmt(vd(f))}. Les informations ont pu être corrigées depuis.</div>`;
if(f.ed!==undefined&&old(f))h+=`<div class="warn">Édition passée (campagne ${f.ed}). Elle ne correspond pas à la campagne actuelle.</div>`;
else if(old(f))h+=`<div class="warn">Information ancienne. ${f.al} : ${fmt(f.a)}. Elle a pu changer depuis.<br><span class="mu">Seuil d’essai : ${f.th||90} jours, non validé.</span></div>`;
if(f.e)h+=bl("État de l’annonce",`${f.e}. Cet état ne vaut pas validation par Eyano.`);
const sb=typeof f.sb==="string"?get(f.sb).sb:f.sb;
if(sb)h+=`<div class="bl"><h3>Situation selon la source</h3><p><b>${sb.s}</b></p><p>${sb.z}</p><p>${sb.c}</p><p class="mu">Situation rapportée le ${fmt(sb.ds)} · ${sb.src}</p></div>`+(age(sb.ds)>30?`<div class="warn">Information ancienne. Situation rapportée : ${fmt(sb.ds)}. Elle a pu changer depuis.<br><span class="mu">Seuil d’essai : 30 jours, non validé.</span></div>`:"");
f.f.forEach(([k,v])=>h+=bl(k,v===null?"Contact en attente de vérification.":v));
if(f.auto){const m={};FI.forEach(x=>{if(x.m!=="annexes")(m[x.src]=m[x.src]||[]).push(`<a href="#f-${x.id}">${x.t}</a>`)});h+=bl("Références citées",Object.keys(m).sort().map(k=>`<b>${k}</b> : ${m[k].join(", ")}`).join("<br>"))}
if(f.u)h+=bl("Quand demander de l’aide urgente",'<a href="#urgences">Voir la page Urgence</a>');
if(f.ex)h+=bl("Examens proposés",f.ex.map(e=>`<a href="#f-${e[0]}">${get(e[0]).t}</a> : ${pr(e)}`).join("<br>"));
if(f.m==="examens"){const a=FI.filter(x=>x.ex&&x.ex.some(e=>e[0]===f.id));h+=bl("Où passer cet examen",a.length?a.map(x=>`<a href="#f-${x.id}">${x.t}</a> : ${pr(x.ex.find(e=>e[0]===f.id))}`).join("<br>")+"<br>L’inscription d’un établissement ne garantit pas que l’examen soit disponible.":"Aucun établissement vérifié pour le moment.")}
if(f.n)h+=`<p class="mu">${f.n}</p>`;
if(f.l)h+=bl("Voir aussi",f.l.map(i=>`<a href="#f-${i}">${get(i).t}</a>`).join("<br>"));
if(f.ln)h+=bl("Voir aussi",f.ln);
h+=`<div class="bl"><dl>${f.d.map(([k,v])=>`<dt>${k}</dt><dd>${fmt(v)}</dd>`).join("")}<dt>Source</dt><dd>${f.src} (source fictive, sans lien)</dd><dt>Statut de validation Eyano</dt><dd>Donnée de démonstration</dd></dl></div>`;
h+=dic(f);
A.innerHTML=h}
function R(){const h=location.hash.slice(1),p=h.split("-");
if(!FI.length){A.innerHTML='<div class="warn">Aucun contenu disponible. Connectez-vous à Internet une première fois pour charger les fiches.</div>';return}
if(h==="urgences")urg();else if(p[0]==="m")mod(p.slice(1).join("-"));else if(p[0]==="f")fiche(p[1]);else home();
if(off)A.insertAdjacentHTML("afterbegin",`<div class="warn">Date du jour simulée : +${off} jours (test)</div>`);
A.insertAdjacentHTML("beforeend",tools());$("#sim").onchange=e=>{off=+e.target.value;R()};
$("#bar").hidden=h==="urgences"}
let last="";addEventListener("hashchange",()=>{if(location.hash!==last)scrollTo(0,0);last=location.hash;R()});
A.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(b){const d=dis();d.push(b.dataset.x);try{localStorage.setItem("eyano-dis",JSON.stringify(d))}catch(_){}R()}});
addEventListener("online",()=>load().then(R));addEventListener("offline",R);load().then(R);
try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
</body>
</html>
